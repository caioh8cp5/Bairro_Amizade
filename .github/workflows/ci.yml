# Pipeline de integração e entrega contínua (CI/CD)
#
# A cada push e Pull Request:
#   1. app      -> checagem de tipos (TypeScript) e lint (ESLint) do aplicativo
#   2. backend  -> testes das Cloud Functions e das Security Rules nos emuladores, com cobertura
#   3. sonar    -> análise estática e de segurança no SonarCloud, com a cobertura dos testes
# Só na branch main, depois de tudo passar:
#   4. deploy   -> publica regras, índices, Cloud Functions e páginas no Firebase
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (tipos e lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # --ignore-scripts: não executa scripts de instalação das dependências (boa prática de segurança)
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint

  backend:
    name: Back-end (testes e cobertura)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      # Os emuladores do Firebase precisam de Java
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --ignore-scripts
      - run: npm install --global --ignore-scripts firebase-tools@15.35.0
      - run: npm run build
      - run: npm test
      # O relatório usa caminhos relativos à pasta functions; o Sonar lê a partir da raiz do repositório
      - run: sed -i 's#^SF:src#SF:functions/src#' coverage/lcov.info
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: functions/coverage/lcov.info

  sonar:
    name: SonarCloud
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # histórico completo para o Sonar identificar código novo
      - uses: actions/download-artifact@v8
        with:
          name: coverage
          path: functions/coverage
      - uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy:
    name: Deploy (Firebase)
    needs: [app, backend]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Verifica credencial
        id: cred
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Segredo FIREBASE_SERVICE_ACCOUNT não configurado; deploy pulado."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.cred.outputs.ok == 'true'
      - uses: actions/setup-node@v7
        if: steps.cred.outputs.ok == 'true'
        with:
          node-version: 22
      - name: Publica no Firebase
        if: steps.cred.outputs.ok == 'true'
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npm ci --ignore-scripts --prefix functions
          npm install --global --ignore-scripts firebase-tools@15.35.0
          firebase deploy --only functions,firestore,storage,hosting --project champs-elysees-64bb8 --force --non-interactive
