# Configuração da análise no SonarCloud (usada pelo pipeline .github/workflows/ci.yml)
sonar.organization=caioh8cp5
sonar.projectKey=caioh8cp5_Bairro_Amizade
sonar.projectName=Bairro_Amizade

# Código analisado: app (React Native) e back-end (Cloud Functions)
sonar.sources=app/src,functions/src
sonar.tests=functions/test
sonar.exclusions=**/node_modules/**,functions/lib/**,app/.expo/**

sonar.test.inclusions=functions/test/**

# Cobertura gerada pelo "npm test" do back-end
sonar.javascript.lcov.reportPaths=functions/coverage/lcov.info
# A meta de cobertura vale para o back-end; o app (telas), os próprios testes,
# arquivos de configuração e o index.ts (só liga funções a gatilhos) ficam fora do cálculo
sonar.coverage.exclusions=app/**,functions/src/index.ts,functions/test/**,**/*.config.js,**/*.json,.github/**

# Regra S2699 ("teste sem asserção"): o Sonar não reconhece as asserções do Supertest
# (.expect(401)) nem do @firebase/rules-unit-testing (assertSucceeds/assertFails)
sonar.issue.ignore.multicriteria=t1
sonar.issue.ignore.multicriteria.t1.ruleKey=typescript:S2699
sonar.issue.ignore.multicriteria.t1.resourceKey=functions/test/**

sonar.sourceEncoding=UTF-8
